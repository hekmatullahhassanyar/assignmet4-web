<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a train ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4 ticket-card">
                    <h2 class="text-white mb-4 fw-bold">Book a train ticket</h2>
                    
                    <form>
                        <div class="btn-group role-group mb-4 p-1 rounded-pill bg-white d-inline-flex" role="group">
                            <input type="radio" class="btn-check" name="tripType" id="oneway" autocomplete="off" checked>
                            <label class="btn rounded-pill px-4 py-2 fw-semibold border-0" for="oneway">One way</label>

                            <input type="radio" class="btn-check" name="tripType" id="roundtrip" autocomplete="off">
                            <label class="btn rounded-pill px-4 py-2 fw-semibold border-0 text-muted" for="roundtrip">Round trip</label>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="from" class="form-label text-white fw-medium">From</label>
                                <input type="text" class="form-control custom-input py-3" id="from" value="Astana" required>
                            </div>
                            <div class="col-md-6">
                                <label for="to" class="form-label text-white fw-medium">To</label>
                                <input type="text" class="form-control custom-input py-3" id="to" value="Almaty" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label for="departure" class="form-label text-white fw-medium">Departure</label>
                                <input type="date" class="form-control custom-input py-3" id="departure" required>
                            </div>
                            <div class="col-md-4">
                                <label for="return" class="form-label text-white fw-medium">Return</label>
                                <input type="date" class="form-control custom-input py-3" id="return">
                            </div>
                            <div class="col-md-4">
                                <label for="passengers" class="form-label text-white fw-medium">Passengers</label>
                                <select class="form-select custom-input py-3" id="passengers" required>
                                    <option value="1" selected>1 adult</option>
                                    <option value="2">2 adults</option>
                                    <option value="3">3 adults</option>
                                    <option value="4">4 adults</option>
                                    <option value="5">5 adults</option>
                                    <option value="6">6 adults</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-white fw-medium d-block">Carriage class</label>
                            <div class="d-flex gap-4 flex-wrap">
                                <div class="form-check">
                                    <input class="form-check-input custom-radio" type="radio" name="carriageClass" id="seat" required>
                                    <label class="form-check-label text-white" for="seat">Seat</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input custom-radio" type="radio" name="carriageClass" id="coupe" checked>
                                    <label class="form-check-label text-white" for="coupe">Coupé</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input custom-radio" type="radio" name="carriageClass" id="sleeper">
                                    <label class="form-check-label text-white" for="sleeper">Sleeper</label>
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="phone" class="form-label text-white fw-medium">Phone</label>
                                <div class="input-group">
                                    <span class="input-group-text country-code border-0 text-white fw-semibold">+7</span>
                                    <input type="tel" class="form-control custom-input py-3" id="phone" value="701-234-56-78" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label text-white fw-medium">Email</label>
                                <input type="email" class="form-control custom-input py-3" id="email" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input custom-checkbox" id="smsCheck">
                            <label class="form-check-label text-white" for="smsCheck">Also send the ticket by SMS</label>
                        </div>
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input custom-checkbox" id="rulesCheck" required>
                            <label class="form-check-label text-white" for="rulesCheck">I agree with the carriage rules</label>
                        </div>

                        <div class="d-flex flex-column-reverse flex-md-row gap-3 justify-content-end mt-4">
                            <button type="reset" class="btn btn-light rounded-pill px-5 py-3 fw-semibold border-0 w-100 w-md-auto">Clear</button>
                            <button type="submit" class="btn btn-warning rounded-pill px-5 py-3 fw-semibold border-0 w-100 w-md-auto text-dark">Find trains</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
