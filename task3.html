<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve a table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card border-0 shadow p-4 rounded-4">
                    <h2 class="mb-4 fw-bold">Reserve a table</h2>
                    
                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label">Your name</label>
                            <input type="text" class="form-control" id="name" placeholder="Your name" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Email" required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" required>
                        </div>

                        <div class="mb-3">
                            <label for="guests" class="form-label">Guests</label>
                            <input type="number" class="form-control" id="guests" min="1" required>
                        </div>

                        <div class="mb-3">
                            <label for="date" class="form-label">Date</label>
                            <input type="date" class="form-control" id="date" required>
                        </div>

                        <div class="mb-3">
                            <label for="mealtime" class="form-label">Meal Time</label>
                            <select class="form-select" id="mealtime">
                                <option>Lunch</option>
                                <option>Dinner</option>
                            </select>
                        </div>

                        <fieldset class="mb-3">
                            <legend class="form-label fs-6">Seating:</legend>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="seating" id="inside" checked>
                                <label class="form-check-label" for="inside">Inside</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="seating" id="terrace">
                                <label class="form-check-label" for="terrace">Terrace</label>
                            </div>
                        </fieldset>

                        <div class="mb-3">
                            <label for="comments" class="form-label">Comments</label>
                            <textarea class="form-control" id="comments" placeholder="Comments" rows="3"></textarea>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="terms" required>
                            <label class="form-check-label" for="terms">I agree to the terms</label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">Reserve</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
